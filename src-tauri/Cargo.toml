[package]
name = "chaoslauncher"
version = "0.1.0"
description = "Docker-powered Sonic Mania build launcher"
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-only"

[lib]
name = "chaoslauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned stack from AGENTS.md; build orchestration lands in Phases 2-5.
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bollard = "0.17"
git2 = "0.19"
sha2 = "0.10" # user-supplied Data.rsdk fingerprint; no expected hash is bundled
futures-util = "0.3" # consume the Docker build response stream
tar = "0.4" # assemble the in-memory Docker build context
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
